<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="stylesheet" href="../../component/navbar/nav.css">
  <link rel="stylesheet" href="../../component/footer/footer.css">
  <link rel="stylesheet" href="Compare.css">

  <title id="pageTitle">Compare Dishes</title>
</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>

<h1 id="titleText">Compare Dishes</h1>

<div class="input-card">

  <select id="dish1"></select>
  <select id="dish2"></select>

  <button onclick="compare()" id="compareBtn">Compare</button>

</div>

<div id="result" class="result-container"></div>

<!-- FOOTER -->
<div id="footer"></div>

<script src="Compare.js"></script>

<script>
// navbar + footer
fetch("../../component/navbar/nav.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("navbar").innerHTML = data;
  });

fetch("../../component/footer/footer.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("footer").innerHTML = data;
  });
</script>

<!-- 🌍 language system -->
<script src="/language/language.js"></script>

</body>
</html>
