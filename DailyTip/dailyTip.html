<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title id="pageTitle">Daily Tip | CookHub</title>

  <link rel="stylesheet" href="dailyTip.css">
</head>

<body>

<!-- BACK HOME -->
<a href="/index.html" class="back-home" id="homeLink">← Home</a>

<!-- HERO -->
<section class="hero">

  <div class="overlay"></div>

  <div class="hero-content">

    <h1 id="heroTitle">🌟 Daily Cooking Tip</h1>
    <p id="heroDesc">Fresh kitchen hacks every time you visit</p>

  </div>

</section>

<!-- MAIN CARD -->
<section class="card">

  <h2 id="todayTipTitle">Today's Tip</h2>

  <p id="tipText">Loading...</p>

  <div class="buttons">

    <button onclick="newTip()" id="newTipBtn">🔁 New Tip</button>

    <button onclick="saveTip()" id="saveBtn">❤️ Save</button>

  </div>

</section>

<!-- FAVORITES -->
<section class="favorites">

  <h2 id="savedTipsTitle">Saved Tips</h2>

  <ul id="favList"></ul>

</section>

<!-- JS -->
<script src="dailyTip.js"></script>

<!-- 🌍 language system -->
<script src="/language/language.js"></script>

</body>

</html>
