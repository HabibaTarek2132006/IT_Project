<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <title id="pageTitle">Submit Recipe</title>

  <link rel="stylesheet" href="../../component/navbar/nav.css">
  <link rel="stylesheet" href="../../component/footer/footer.css">
  <link rel="stylesheet" href="submit.css">
</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>

<h1 id="titleText">Submit Your Recipe</h1>

<div class="form-container">

  <form id="recipeForm">

    <label id="nameLabel">Recipe Name</label>
    <input type="text" id="name" placeholder="Enter recipe name" required>

    <label id="imageLabel">Upload Image</label>
    <input type="file" id="image">

    <label id="ingredientsLabel">Ingredients</label>
    <textarea id="ingredients" placeholder="Write ingredients..." required></textarea>

    <label id="stepsLabel">Instructions</label>
    <textarea id="steps" placeholder="How to cook..." required></textarea>

    <label id="categoryLabel">Category</label>
    <select id="category">
      <option>Egyptian</option>
      <option>Italian</option>
      <option>Indian</option>
      <option>Dessert</option>
    </select>

    <button type="submit" id="submitBtn">Submit Recipe</button>

  </form>

  <p id="msg"></p>

</div>

<!-- FOOTER -->
<div id="footer"></div>

<script>

// 📦 Navbar + Footer
fetch("../../component/navbar/nav.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("navbar").innerHTML = data;
  });

fetch("../../component/footer/footer.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("footer").innerHTML = data;
  });

</script>

<script src="/language/language.js"></script>
<script src="submit.js"></script>

</body>
</html>
