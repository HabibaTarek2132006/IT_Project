<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="stylesheet" href="../../component/navbar/nav.css">
  <link rel="stylesheet" href="../../component/footer/footer.css">
  <link rel="stylesheet" href="planner.css">

  <title>weekly planner</title>
</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>

<div class="container">

  <h2 id="plannerTitle">Weekly Meal Planner</h2>

  <table>
    <tr>
      <th id="dayText">Day</th>
      <th id="breakfastText">Breakfast</th>
      <th id="lunchText">Lunch</th>
      <th id="dinnerText">Dinner</th>
    </tr>

    <tr>
      <td id="satText">Saturday</td>
      <td><input id="sat-b"></td>
      <td><input id="sat-l"></td>
      <td><input id="sat-d"></td>
    </tr>

    <tr>
      <td id="sunText">Sunday</td>
      <td><input id="sun-b"></td>
      <td><input id="sun-l"></td>
      <td><input id="sun-d"></td>
    </tr>

    <tr>
      <td id="monText">Monday</td>
      <td><input id="mon-b"></td>
      <td><input id="mon-l"></td>
      <td><input id="mon-d"></td>
    </tr>

    <tr>
      <td id="tueText">Tuesday</td>
      <td><input id="tue-b"></td>
      <td><input id="tue-l"></td>
      <td><input id="tue-d"></td>
    </tr>

    <tr>
      <td id="wedText">Wednesday</td>
      <td><input id="wed-b"></td>
      <td><input id="wed-l"></td>
      <td><input id="wed-d"></td>
    </tr>

    <tr>
      <td id="thuText">Thursday</td>
      <td><input id="thu-b"></td>
      <td><input id="thu-l"></td>
      <td><input id="thu-d"></td>
    </tr>

    <tr>
      <td id="friText">Friday</td>
      <td><input id="fri-b"></td>
      <td><input id="fri-l"></td>
      <td><input id="fri-d"></td>
    </tr>

  </table>

  <button onclick="savePlan()" id="saveBtn">Save Plan</button>
  <button onclick="clearPlan()" id="clearBtn">Clear Plan</button>

</div>

<!-- FOOTER -->
<div id="footer"></div>

<script>

// 💾 Save
function savePlan() {
  const inputs = document.querySelectorAll("input");

  inputs.forEach(input => {
    localStorage.setItem(input.id, input.value);
  });

  alert("Saved successfully ✅");
}

// 🔄 Load
function loadPlan() {
  const inputs = document.querySelectorAll("input");

  inputs.forEach(input => {
    input.value = localStorage.getItem(input.id) || "";
  });
}

// 🧹 Clear
function clearPlan() {
  const inputs = document.querySelectorAll("input");

  inputs.forEach(input => {
    input.value = "";
    localStorage.removeItem(input.id);
  });

  alert("Plan cleared 🧹");
}


// 🟢 load only once
window.onload = function () {
  loadPlan();
};

fetch("../../component/navbar/nav.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("navbar").innerHTML = data;

    // 🔥 أهم سطر في المشروع كله
    reapplyLanguage();
  });


fetch("../../component/footer/footer.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("footer").innerHTML = data;
  });

</script>

<!-- Language system -->
<script src="/language/language.js"></script>

</body>
</html>
