<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="stylesheet" href="../../component/navbar/nav.css">
  <link rel="stylesheet" href="../../component/footer/footer.css">
  <link rel="stylesheet" href="ing.css">

  <title id="pageTitle">Ingredients Calculator</title>
</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>

<div class="container">

  <h2 id="titleText">Ingredients Calculator 🍲</h2>

  <!-- Recipe Name -->
  <input type="text" id="name" placeholder="Recipe Name">

  <!-- Country -->
  <select id="country">
    <option value="Egypt">Egypt</option>
    <option value="Italy">Italy</option>
    <option value="USA">USA</option>
    <option value="India">India</option>
  </select>

  <!-- Ingredients -->
  <textarea id="input" placeholder="Write ingredients"></textarea>

  <!-- People -->
  <input type="number" id="people" value="2" min="1">

  <button onclick="loadRecipe()" id="calcBtn">Calculate</button>

  <hr>

  <h3 id="recipeTitle"></h3>
  <p id="countryText"></p>

  <ul id="output"></ul>

</div>

<!-- FOOTER -->
<div id="footer"></div>

<script>

// 📦 Navbar + Footer load
fetch("../../component/navbar/nav.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("navbar").innerHTML = data;
  });

fetch("../../component/footer/footer.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("footer").innerHTML = data;
  });

</script>

<script src="/language/language.js"></script>
<script src="ing.js"></script>

</body>
</html>
