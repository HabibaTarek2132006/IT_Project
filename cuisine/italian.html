<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <title id="pageTitle">Italian Food</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- CSS -->
  <link rel="stylesheet" href="../../component/navbar/nav.css">
  <link rel="stylesheet" href="../../component/footer/footer.css">
  <link rel="stylesheet" href="italian.css">

</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>

<h1 id="titleText">🇮🇹 Italian Food</h1>

<div class="container">

  <div class="card pizza">
    <h3 id="pizzaText">Pizza</h3>
    <button class="save-btn" onclick="addBookmark('Pizza', 'Italian', '🍕')" id="saveBtn">❤️ Save</button>
  </div>

  <div class="card lasagna">
    <h3 id="lasagnaText">Lasagna</h3>
    <button class="save-btn" onclick="addBookmark('Lasagna', 'Italian', '🍝')" id="saveBtn2">❤️ Save</button>
  </div>

  <div class="card pasta">
    <h3 id="pastaText">Pasta Alfredo</h3>
    <button class="save-btn" onclick="addBookmark('Pasta Alfredo', 'Italian', '🍝')" id="saveBtn3">❤️ Save</button>
  </div>

  <div class="card tiramisu">
    <h3 id="tiramisuText">Tiramisu</h3>
    <button class="save-btn" onclick="addBookmark('Tiramisu', 'Italian', '🍰')" id="saveBtn4">❤️ Save</button>
  </div>

  <div class="card risotto">
    <h3 id="risottoText">Risotto</h3>
    <button class="save-btn" onclick="addBookmark('Risotto', 'Italian', '🍚')" id="saveBtn5">❤️ Save</button>
  </div>

</div>

<!-- FOOTER -->
<div id="footer"></div>

<!-- JS -->
<script>
fetch("../../component/navbar/nav.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("navbar").innerHTML = data;
  });

fetch("../../component/footer/footer.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("footer").innerHTML = data;
  });

// Bookmark
function addBookmark(name, from, icon) {
  let bookmarks = JSON.parse(localStorage.getItem("bookmarks")) || [];
  bookmarks.push({ name, from, icon });
  localStorage.setItem("bookmarks", JSON.stringify(bookmarks));
  alert("Saved ❤️");
}
</script>

<!-- 🌍 language system -->
<script src="/language/language.js"></script>

</body>

</html>
