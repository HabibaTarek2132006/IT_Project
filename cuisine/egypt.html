<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <title id="pageTitle">Egyptian Food</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- CSS -->
  <link rel="stylesheet" href="/component/navbar/nav.css">
  <link rel="stylesheet" href="/component/footer/footer.css">
  <link rel="stylesheet" href="/cuisine/egypt.css">
</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>

<h1 id="titleText">🇪🇬 Egyptian Food</h1>

<div class="container">

  <div class="card koshari">
    <h3 id="koshariText">Koshari</h3>

    <button class="save-btn" onclick="addBookmark('Koshari', 'Egyptian', '🍲')" id="saveBtn">
      ❤️ Save
    </button>
  </div>

  <div class="card feteer">
    <h3 id="feteerText">Feteer Meshaltet</h3>

    <button class="save-btn" onclick="addBookmark('Feteer Meshaltet', 'Egyptian', '🥞')" id="saveBtn2">
      ❤️ Save
    </button>
  </div>

  <div class="card moussaka">
    <h3 id="moussakaText">Moussaka</h3>

    <button class="save-btn" onclick="addBookmark('Moussaka', 'Egyptian', '🍆')" id="saveBtn3">
      ❤️ Save
    </button>
  </div>

</div>

<!-- FOOTER -->
<div id="footer"></div>

<!-- JS -->
<script>
fetch("/component/navbar/nav.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("navbar").innerHTML = data;
  });

fetch("/component/footer/footer.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("footer").innerHTML = data;
  });

// Bookmark function
function addBookmark(name, from, icon) {
  let bookmarks = JSON.parse(localStorage.getItem("bookmarks")) || [];
  bookmarks.push({ name, from, icon });
  localStorage.setItem("bookmarks", JSON.stringify(bookmarks));
  alert("Saved ❤️");
}
</script>

<!-- 🌍 language system -->
<script src="/language/language.js"></script>

</body>

</html>
